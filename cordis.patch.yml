# dsh-soul — bundle patch layer
#
# Declares the plugin as a Cordis loader entry, which is what makes the package a
# standard profile bundle: `dsh plugin --profile <p> add dsh-soul` installs and
# mounts it without hand-editing cordis.patch.yml.
#
# `id: dsh-soul` is NOT cosmetic — it is the settings namespace this plugin reads
# and writes (`ctx.configForms.get("dsh-soul")` on the client, `ctx.settings` on
# the host), and the host prints it next to the module name on the plugin page.
# One name for the package, the row and the namespace is what keeps that page
# readable; renaming it orphans every saved card.
- insert:
    - id: dsh-soul
      name: 'dsh-soul'
